<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Operasyon Checklist</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 850px;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        h1 { font-size: 2rem; font-weight: 700; }
        .status-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            padding: 0.45rem 1rem;
            border-radius: 999px;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .progress-bar-bg {
            width: 100%; height: 10px; background: #334155;
            border-radius: 999px; overflow: hidden; margin-bottom: 1.75rem;
        }
        .progress-bar-fill { height: 100%; width: 0%; background: var(--success); transition: width 0.3s ease; }
        .add-form { display: flex; gap: 0.75rem; margin-bottom: 1.75rem; }
        .add-input {
            flex: 1; background: rgba(15, 23, 42, 0.8); border: 1px solid #334155;
            color: var(--text-main); padding: 1rem 1.25rem; border-radius: 10px; font-size: 1.15rem; outline: none;
        }
        .add-btn {
            background: var(--accent); color: #0f172a; border: none; padding: 0 1.75rem;
            border-radius: 10px; font-size: 1.1rem; font-weight: 700; cursor: pointer;
        }
        .checklist { list-style: none; display: flex; flex-direction: column; gap: 0.85rem; }
        .checklist-item {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(15, 23, 42, 0.6); padding: 1.1rem 1.25rem;
            border-radius: 12px; border: 1px solid transparent; user-select: none;
        }
        .item-left { display: flex; align-items: center; flex: 1; cursor: pointer; padding-right: 1rem; }
        .checklist-item.completed .item-left { opacity: 0.55; }
        .checklist-item.completed .item-text { text-decoration: line-through; color: var(--text-muted); }
        .checkbox {
            width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--text-muted);
            margin-right: 1.25rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .checklist-item.completed .checkbox { background-color: var(--success); border-color: var(--success); }
        .checkbox::after { content: '✓'; color: white; font-size: 1.2rem; font-weight: bold; display: none; }
        .checklist-item.completed .checkbox::after { display: block; }
        .item-text { font-size: 1.3rem; font-weight: 500; word-break: break-word; }
        .delete-btn {
            background: rgba(239, 68, 68, 0.1); color: var(--danger); border: none;
            width: 38px; height: 38px; border-radius: 8px; cursor: pointer; font-size: 1.1rem;
        }
        .live-dot {
            display: inline-block; width: 10px; height: 10px; background: var(--success);
            border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px var(--success);
        }
        .sync-info { margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted); text-align: right; }
        
        /* Kiosk Modu (?kiosk=1) için düzenleme araçlarını gizle */
        body.kiosk-mode .add-form,
        body.kiosk-mode .delete-btn {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Günlük Kontrol Listesi</h1>
            <div class="status-badge" id="counter">0 / 0</div>
        </div>

        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>

        <form class="add-form" id="add-form">
            <input type="text" id="new-task-input" class="add-input" placeholder="Yeni madde yazın..." autocomplete="off">
            <button type="submit" class="add-btn">+ Ekle</button>
        </form>

        <ul class="checklist" id="checklist-container"></ul>
        <div class="sync-info"><span class="live-dot"></span><span id="sync-status">Firebase Bağlanıyor...</span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, set, remove, update } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

        // URL'de ?kiosk=1 varsa yönetim araçlarını gizle
        const urlParams = new URLSearchParams(window.location.search);
        const isKiosk = urlParams.get('kiosk') === '1';
        if (isKiosk) {
            document.body.classList.add('kiosk-mode');
        }

        // BURAYA KENDİ FIREBASE BİLGİLERİNİZİ YAPIŞTIRIN
      const firebaseConfig = {
            apiKey: "AIzaSyD...", // Sizin kendi API Key'iniz
            authDomain: "checklist-aafdd.firebaseapp.com",
            databaseURL: "https://checklist-aafdd-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "checklist-aafdd",
            storageBucket: "checklist-aafdd.firebasestorage.app",
            messagingSenderId: "467035959282",
            appId: "1:467035959282:web:..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const tasksRef = ref(db, 'checklist_items');

        const container = document.getElementById('checklist-container');
        const counterEl = document.getElementById('counter');
        const progressFill = document.getElementById('progress-fill');
        const addForm = document.getElementById('add-form');
        const inputEl = document.getElementById('new-task-input');
        const syncStatus = document.getElementById('sync-status');

        onValue(tasksRef, (snapshot) => {
            syncStatus.textContent = "Firebase Canlı Bağlantı Aktif";
            const data = snapshot.val();
            container.innerHTML = '';
            
            if (!data) {
                counterEl.textContent = '0 / 0';
                progressFill.style.width = '0%';
                return;
            }

            const entries = Object.entries(data);
            let completedCount = 0;

            entries.forEach(([key, task]) => {
                if (task.done) completedCount++;

                const li = document.createElement('li');
                li.className = `checklist-item ${task.done ? 'completed' : ''}`;

                const leftDiv = document.createElement('div');
                leftDiv.className = 'item-left';
                if (!isKiosk) {
                    leftDiv.onclick = () => update(ref(db, `checklist_items/${key}`), { done: !task.done });
                }

                const checkbox = document.createElement('div');
                checkbox.className = 'checkbox';

                const textSpan = document.createElement('span');
                textSpan.className = 'item-text';
                textSpan.textContent = task.text;

                leftDiv.appendChild(checkbox);
                leftDiv.appendChild(textSpan);

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '✕';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    remove(ref(db, `checklist_items/${key}`));
                };

                li.appendChild(leftDiv);
                li.appendChild(delBtn);
                container.appendChild(li);
            });

            counterEl.textContent = `${completedCount} / ${entries.length}`;
            const pct = (completedCount / entries.length) * 100;
            progressFill.style.width = `${pct}%`;
        }, (error) => {
            syncStatus.textContent = "Bağlantı Hatası: Firebase ayarlarını veya Rules iznini kontrol edin.";
        });

        addForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = inputEl.value.trim();
            if (!text) return;

            const newItemRef = push(tasksRef);
            set(newItemRef, {
                text: text,
                done: false
            });
            inputEl.value = '';
        });
    </script>
</body>
</html>
